name: Github actions validation php

on:
  workflow_call:

env:
  PHP_VERSION: "8.5"

jobs:
  Setup:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: PHP version
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer

      - name: Validate composer.json and composer.lock
        run: composer validate

      - name: Cache Composer
        uses: actions/cache@v5
        with:
          path: ~/.cache/composer/files
          key: composer-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ env.PHP_VERSION }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

  Phpcs:
    runs-on: ubuntu-latest

    needs: Setup

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: PHP version
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer

      - name: Cache Composer
        uses: actions/cache@v5
        with:
          path: ~/.cache/composer/files
          key: composer-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ env.PHP_VERSION }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Phpcs validation
        run: php vendor/bin/phpcs

  Pint:
    runs-on: ubuntu-latest

    needs: Setup

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: PHP version
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer

      - name: Cache Composer
        uses: actions/cache@v5
        with:
          path: ~/.cache/composer/files
          key: composer-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ env.PHP_VERSION }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Pint validation
        run: php vendor/bin/pint --test

  Phpstan:
    runs-on: ubuntu-latest

    needs: Setup

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: PHP version
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer

      - name: Cache Composer
        uses: actions/cache@v5
        with:
          path: ~/.cache/composer/files
          key: composer-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ env.PHP_VERSION }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Phpstan validation
        run: php vendor/bin/phpstan analyse
