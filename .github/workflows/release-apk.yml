name: Github actions release .apk

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string

jobs:
  Release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug
        run: ./gradlew assembleDebug

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Run Lint
        run: ./gradlew lint

      - name: Decode signing key
        run: echo "${{ secrets.SIGNING_KEY }}" | base64 -d > release-key.jks

      - name: Build signed release APK
        env:
          SIGNING_KEY_PATH: ${{ github.workspace }}/release-key.jks
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk ${{ inputs.app_name }}-${{ github.ref_name }}.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name }}-${{ github.ref_name }}
          path: ${{ inputs.app_name }}-${{ github.ref_name }}.apk

      - name: Clean up keystore
        if: always()
        run: rm -f release-key.jks

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ inputs.app_name }} ${{ github.ref_name }}
          files: ${{ inputs.app_name }}-${{ github.ref_name }}.apk
