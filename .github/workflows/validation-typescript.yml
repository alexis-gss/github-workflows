name: Github actions validation typescript

on:
  workflow_call:

jobs:
  Eslint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
      - name: NPM dependencies
        run: npm ci
      - name: Eslint validation
        run: npm run eslint